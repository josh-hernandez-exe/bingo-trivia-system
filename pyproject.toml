[project]
name = "bingo-trivia-system"
version = "0.1.0"
description = "Toolkit for hosting a 1-hour trivia-bingo event end-to-end: generate unique cards, simulate winners, mass-email PDFs, and run a local presenter UI with live winner verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Josh Hernandez" }]
keywords = ["bingo", "trivia", "event", "cli", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=62"]
graph = ["msal>=1.30"]
ses = ["boto3>=1.34"]
slides = []
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "poethepoet>=0.27",
    "pre-commit>=3.7",
]

[project.scripts]
bts = "bingo_trivia_system.cli:app"

[project.urls]
Repository = "https://github.com/josh-hernandez-exe/bingo-trivia-system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bingo_trivia_system"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["events", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM", "RUF"]
ignore = ["E501", "B008", "UP042", "B017", "SIM105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests",
    "integration: tests that touch network or external services",
]

[tool.coverage.run]
source = ["src/bingo_trivia_system"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
types = "mypy src/"
test = "pytest"
check-docs = "bts docs check"
check-mcp = "python scripts/check_mcp_sync.py"
check = ["lint", "format-check", "types", "test", "check-docs", "check-mcp"]
